[project]
name = "commitmate"
version = "1.0.2"
description = "Generates Conventional Commits-style messages from staged git diffs using a local Ollama model."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    { name = "Ishan Pathak" }
]
dependencies = [
    "requests",
    "rich",
]

[project.scripts]
commitmate = "commitmate.cli:main"

[project.urls]
Homepage = "https://github.com/theishanpathak/commitmate"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["commitmate"]